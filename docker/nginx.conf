server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Keep redirects relative so the container's internal port isn't leaked
    # in the Location header when running behind a proxy / ingress.
    absolute_redirect off;

    # The app uses SharedArrayBuffer for its multithreaded WASM codecs, which
    # requires the page to be cross-origin isolated. These mirror serve.json.
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;

    # Mirror the /editor -> / redirect from serve.json.
    location = /editor {
        return 302 /;
    }

    # Long-lived, content-hashed assets can be cached aggressively.
    location /c/ {
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        try_files $uri $uri/ /index.html;
    }
}
